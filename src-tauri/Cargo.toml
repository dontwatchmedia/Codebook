[package]
name = "codebook"
version = "0.2.11"
description = "A book editor built for writing about code"
authors = ["CodeBook"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
windows = "0.61.3"

[profile.release]
strip = true
lto = false
codegen-units = 16
